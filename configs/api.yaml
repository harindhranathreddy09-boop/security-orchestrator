server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  tls:
    enabled: false
    cert_file: /run/secrets/tls_cert
    key_file:  /run/secrets/tls_key

auth:
  jwt_secret_file: /run/secrets/jwt_secret
  role_claim: roles

cors:
  allowed_origins:
    - http://localhost:3000   # dev UI (if you run it outside Docker)
    - https://ui.example.com  # prod UI
  allowed_methods: [GET, POST, PUT, DELETE, OPTIONS]
  allowed_headers: [*]
